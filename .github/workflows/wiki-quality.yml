name: Wiki quality
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  quality:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Fetch pinned preview icons
        if: github.event_name == 'pull_request'
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Mar-7th/StarRailRes.git .srr
          cd .srr
          git sparse-checkout set icon
          git fetch --depth 1 origin dbe8cdfcfb0bf657b9fe1cf92d5537f118ccb487
          git checkout dbe8cdfcfb0bf657b9fe1cf92d5537f118ccb487
          cd ..
          python wiki/copy_icons.py
      - name: Build static Wiki
        run: python wiki/build_wiki.py
      - name: Check data and tracked-link baseline
        run: python tools/check_quality.py
      - name: Check generated site and documents
        run: |
          python tools/verify_site.py
          python tools/verify_docs.py
          python -m unittest tools.test_wiki_search tools.test_quality_gate tools.test_preview_review tools.test_preview_review_server tools.test_preview_artifact tools.test_package_preview tools.test_preview_bundle tools.test_stage_preview tools.test_trusted_quality tools.test_trusted_receipt tools.test_preview_catalog tools.test_reconcile_previews tools.test_preview_release tools.test_verify_preview_publication -v
          python -m unittest discover -s tests -p test_audit_mirror_entities.py -v
          python -m unittest tools.test_enemy_index -v
          python -m unittest tools.test_preview_roundtrip_workflow -v
      - name: Check JavaScript syntax
        run: |
          node --check wiki/assets/app.js
          node --check wiki/assets/home.js
          node --check preview_shell/shell.js
          node --check preview_shell/frame.js
      - name: Check browser interactions
        env:
          WIKI_BROWSER: /usr/bin/google-chrome
        run: |
          node tools/test_wiki_browser.mjs
          node tools/test_preview_browser.mjs
          node tools/test_preview_browser.mjs --external
          node tools/test_preview_browser.mjs --transient-object
          node tools/test_preview_browser.mjs --service
          node tools/test_preview_browser.mjs --service --service-initial-failure
      - name: Check real Wiki in preview viewer
        if: github.event_name == 'pull_request'
        env:
          WIKI_BROWSER: /usr/bin/google-chrome
        run: |
          node tools/test_preview_wiki.mjs
      - name: Package untrusted preview input
        if: github.event_name == 'pull_request'
        run: python tools/package_preview.py wiki "$RUNNER_TEMP/wiki-preview.zip"
      - name: Upload preview input (not published)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: wiki-preview-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wiki-preview.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Download preview input for round-trip verification
        if: github.event_name == 'pull_request'
        id: download_preview_first
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          digest-mismatch: error
          name: wiki-preview-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-roundtrip
      - name: Wait before retrying preview download
        if: steps.download_preview_first.outcome == 'failure'
        run: sleep 5
      - name: Retry preview download
        if: steps.download_preview_first.outcome == 'failure'
        id: download_preview_second
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          digest-mismatch: error
          name: wiki-preview-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-roundtrip
      - name: Wait before final preview download
        if: steps.download_preview_second.outcome == 'failure'
        run: sleep 10
      - name: Final preview download
        if: steps.download_preview_second.outcome == 'failure'
        id: download_preview_final
        uses: actions/download-artifact@v8
        with:
          digest-mismatch: error
          name: wiki-preview-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-roundtrip
      - name: Verify downloaded preview input
        if: github.event_name == 'pull_request'
        id: verify_preview_roundtrip
        run: |
          cmp "$RUNNER_TEMP/wiki-preview.zip" "$RUNNER_TEMP/preview-roundtrip/wiki-preview.zip"
          python - <<'PY'
          import os
          from pathlib import Path
          from tools.preview_artifact import extract_preview_zip
          root = Path(os.environ['RUNNER_TEMP'])
          site = root / 'verified-preview'
          extract_preview_zip(root / 'preview-roundtrip' / 'wiki-preview.zip', site)
          required = ['index.html', 'assets/app.js', 'data/titles.js']
          if not all((site / path).is_file() for path in required):
              raise SystemExit('Preview is missing required files')
          pages = sum(1 for _ in (site / 'pages').rglob('*.html'))
          icons = sum(1 for _ in (site / 'assets/icons').rglob('*.png'))
          if not pages or not icons:
              raise SystemExit('Preview is missing pages or icons')
          print(f'PASS: preview archive round-trip: {pages} pages, {icons} icons')
          PY
      - name: Summarize preview download
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          FIRST: ${{ steps.download_preview_first.outcome }}
          SECOND: ${{ steps.download_preview_second.outcome }}
          FINAL: ${{ steps.download_preview_final.outcome }}
          VERIFY: ${{ steps.verify_preview_roundtrip.outcome }}
        run: |
          {
            echo '### Preview artifact round trip'
            echo "- First download: ${FIRST:-not run}"
            echo "- Second download: ${SECOND:-not run}"
            echo "- Final download: ${FINAL:-not run}"
            echo "- Byte comparison and package verification: ${VERIFY:-not run}"
            echo 'A retry can leave an error annotation even when the final verification succeeds. Inspect the failed attempt log; failures can have different causes.'
          } >> "$GITHUB_STEP_SUMMARY"
