name: Deploy Wiki
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: wiki
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Sparse clone SRR (icon/ only, pinned commit)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Mar-7th/StarRailRes.git .srr
          cd .srr
          git sparse-checkout set icon
          git fetch --depth 1 origin dbe8cdfcfb0bf657b9fe1cf92d5537f118ccb487
          git checkout dbe8cdfcfb0bf657b9fe1cf92d5537f118ccb487
      - name: Copy needed icons
        run: python wiki/copy_icons.py
      - name: Build wiki
        run: python wiki/build_wiki.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wiki
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
