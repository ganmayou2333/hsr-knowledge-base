name: Trusted Wiki data checks

# This workflow takes effect only after it exists on the default branch.
# PR files are data: never execute their scripts or install their dependencies.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  trusted-data:
    name: Check PR data with base-branch tools
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Confirm trusted workflow and checkout base
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$GITHUB_EVENT_NAME" = pull_request_target
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$EXPECTED_BASE"
          test "$GITHUB_WORKFLOW_SHA" = "$EXPECTED_BASE"
          test "$(git -C trusted rev-parse HEAD)" = "$EXPECTED_BASE"
      - name: Check out PR as data
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          path: input
          # Fork content is read only by trusted scanners below; never run PR files.
          allow-unsafe-pr-checkout: true
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Confirm checked-out PR revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git -C input rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Verify PR remains current before inspection
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,headRefOid,baseRefOid |
            jq -e --arg head "$EXPECTED_HEAD" --arg base "$EXPECTED_BASE" \
              '.state == "OPEN" and .headRefOid == $head and .baseRefOid == $base' > /dev/null
      - name: Inspect untrusted data using trusted tools
        run: python3 -I "$GITHUB_WORKSPACE/trusted/tools/trusted_quality.py" "$GITHUB_WORKSPACE/input"
      # Build only with checked-out base code. PR checkout is immutable data.
      # This uploads an inert artifact, never publishes or executes PR code.
      - name: Build isolated preview with trusted code
        run: python3 -I "$GITHUB_WORKSPACE/trusted/tools/trusted_preview_build.py" "$GITHUB_WORKSPACE/input" "$RUNNER_TEMP/wiki-preview.zip"
      - name: Verify PR remains current after inspection
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,headRefOid,baseRefOid |
            jq -e --arg head "$EXPECTED_HEAD" --arg base "$EXPECTED_BASE" \
              '.state == "OPEN" and .headRefOid == $head and .baseRefOid == $base' > /dev/null
      # This receipt is not a preview artifact and is not yet used for publishing.
      # Its only purpose is to record this trusted workflow's event context.
      - name: Record trusted check context
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REPO_ID: ${{ github.event.pull_request.head.repo.id }}
          BASE_REPO_ID: ${{ github.event.pull_request.base.repo.id }}
        run: |
          jq -n \
            --argjson pr "$PR_NUMBER" --arg head "$HEAD_SHA" --arg base "$BASE_SHA" \
            --argjson head_repo "$HEAD_REPO_ID" --argjson base_repo "$BASE_REPO_ID" \
            --argjson run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflow_sha "$GITHUB_WORKFLOW_SHA" \
            '{version: 2, pr: $pr, head: $head, base: $base, head_repo: $head_repo, base_repo: $base_repo, run: $run, attempt: $attempt, workflow_sha: $workflow_sha}' \
            > "$RUNNER_TEMP/trusted-check-receipt.json"
      - name: Upload trusted check context
        uses: actions/upload-artifact@v7
        with:
          name: trusted-check-receipt-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trusted-check-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload unpublished trusted-build preview
        uses: actions/upload-artifact@v7
        with:
          name: trusted-wiki-preview-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wiki-preview.zip
          if-no-files-found: error
          retention-days: 7
